name: Release

# Pushing a tag vX.Y.Z on main builds the Windows installer and publishes it as a GitHub release.
# The tag must match the version in package.json.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish the installer
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check the tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version." >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Package (unsigned)
        run: npx electron-builder --win --publish never
      - name: Publish the GitHub release
        shell: bash
        run: |
          installer=$(ls dist/*.exe | head -n 1)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$installer" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$installer" --title "Vigie ${GITHUB_REF_NAME#v}" --generate-notes --latest
          fi
