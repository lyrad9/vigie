name: Release

# Pushing a tag vX.Y.Z on main builds the Windows installer and publishes it as a GitHub release.
# The tag must match the version in package.json.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish the installer
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check the tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version." >&2
            exit 1
          fi
      - run: npm ci
      # Before the slow steps: a release needs its entry, with a date, in ui/changelog.js.
      - name: Release notes from the changelog
        shell: bash
        run: |
          node scripts/release-notes.js "$GITHUB_REF_NAME" --json changelog.json > release-notes.md
          cat release-notes.md
      - run: npm run check
      - run: npm test
      - name: Package (unsigned)
        run: npx electron-builder --win --publish never
      # The installed app updates itself from the latest release: it reads latest.yml, then
      # downloads the installer it names (the .blockmap lets it fetch only what changed).
      # Its Updates page reads changelog.json to describe a version it does not know yet.
      - name: Publish the GitHub release
        shell: bash
        run: |
          files=(dist/*.exe dist/*.exe.blockmap dist/latest.yml changelog.json)
          for f in "${files[@]}"; do [ -f "$f" ] || { echo "Missing $f" >&2; exit 1; }; done
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "Vigie ${GITHUB_REF_NAME#v}" --notes-file release-notes.md --latest
          fi
